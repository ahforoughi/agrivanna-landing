<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="av7-t av7-d" font-family="Geist, ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif">
  <title id="av7-t">Software today, collars when you want them</title>
  <desc id="av7-d">Today Agrivanna runs on the phone you already own and your existing fence stays where it is. When you are ready, third-party connected collars plug into the same record through an open API, giving automated containment without hardware lock-in. Agrivanna does not build collars.</desc>
  <defs>
    <marker id="av7-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#A6FF3D"/>
    </marker>
  </defs>

  <text x="44" y="44" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#A6FF3D">HARDWARE ROADMAP</text>
  <text x="44" y="79" font-size="27" font-weight="600" fill="#F6F6F4">Built for today's fence. Ready for tomorrow's.</text>
  <text x="44" y="106" font-size="14.5" fill="#B6B6AE">Agrivanna is the software. Collars plug in when you want them — from whoever you choose.</text>

  <!-- TODAY -->
  <rect x="44" y="144" width="412" height="252" rx="14" fill="#F6F6F4" fill-opacity="0.04" stroke="#F6F6F4" stroke-opacity="0.10" stroke-width="1.5"/>
  <rect x="68" y="166" width="80" height="26" rx="13" fill="#A6FF3D"/>
  <text x="108" y="184" font-size="11" font-weight="700" letter-spacing="1.2" fill="#14161A" text-anchor="middle">TODAY</text>
  <text x="68" y="220" font-size="19" font-weight="600" fill="#F6F6F4">Your fence stays put</text>

  <g stroke="#8C8C85" stroke-width="2.5" stroke-linecap="round">
    <line x1="152" y1="256" x2="350" y2="256"/>
    <line x1="152" y1="276" x2="350" y2="276"/>
  </g>
  <g fill="#8C8C85">
    <rect x="164" y="244" width="6" height="48" rx="3"/>
    <rect x="220" y="244" width="6" height="48" rx="3"/>
    <rect x="276" y="244" width="6" height="48" rx="3"/>
    <rect x="332" y="244" width="6" height="48" rx="3"/>
  </g>

  <circle cx="74" cy="322" r="2.5" fill="#A6FF3D" fill-opacity="0.55"/><text x="88" y="326" font-size="13" fill="#B6B6AE">Voice and NFC herd records</text>
  <circle cx="74" cy="346" r="2.5" fill="#A6FF3D" fill-opacity="0.55"/><text x="88" y="350" font-size="13" fill="#B6B6AE">Satellite grazing plans</text>
  <circle cx="74" cy="370" r="2.5" fill="#A6FF3D" fill-opacity="0.55"/><text x="88" y="374" font-size="13" fill="#B6B6AE">Runs on the phone you own</text>

  <line x1="464" y1="270" x2="496" y2="270" stroke="#A6FF3D" stroke-width="2" marker-end="url(#av7-arrow)"/>

  <!-- LATER -->
  <rect x="504" y="144" width="412" height="252" rx="14" fill="#F6F6F4" fill-opacity="0.04" stroke="#A6FF3D" stroke-opacity="0.30" stroke-width="1.5" stroke-dasharray="7 5"/>
  <rect x="528" y="166" width="176" height="26" rx="13" fill="none" stroke="#A6FF3D" stroke-width="1.5"/>
  <text x="616" y="184" font-size="11" font-weight="700" letter-spacing="1.2" fill="#A6FF3D" text-anchor="middle">WHEN YOU'RE READY</text>
  <text x="528" y="220" font-size="19" font-weight="600" fill="#F6F6F4">Collars plug in</text>

  <ellipse cx="710" cy="272" rx="40" ry="26" fill="none" stroke="#8C8C85" stroke-width="7"/>
  <rect x="696" y="238" width="28" height="18" rx="5" fill="#A6FF3D"/>

  <circle cx="534" cy="322" r="2.5" fill="#A6FF3D" fill-opacity="0.55"/><text x="548" y="326" font-size="13" fill="#B6B6AE">Open API — any vendor</text>
  <circle cx="534" cy="346" r="2.5" fill="#A6FF3D" fill-opacity="0.55"/><text x="548" y="350" font-size="13" fill="#B6B6AE">Automated containment</text>
  <circle cx="534" cy="370" r="2.5" fill="#A6FF3D" fill-opacity="0.55"/><text x="548" y="374" font-size="13" fill="#B6B6AE">No hardware lock-in</text>

  <rect x="44" y="420" width="872" height="88" rx="14" fill="#F6F6F4" fill-opacity="0.04" stroke="#F6F6F4" stroke-opacity="0.10" stroke-width="1.5"/>
  <text x="68" y="446" font-size="11.5" font-weight="700" letter-spacing="1.4" fill="#A6FF3D">WHY IT'S BUILT THIS WAY</text>
  <text x="68" y="470" font-size="14.5" fill="#F6F6F4">Agrivanna does not build collars. As connected hardware matures across the</text>
  <text x="68" y="490" font-size="14.5" fill="#F6F6F4">industry, our open architecture talks to it — so you are never locked to one vendor.</text>
</svg>
