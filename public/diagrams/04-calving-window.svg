<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="av4-t av4-d" font-family="Geist, ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif">
  <title id="av4-t">The 21-day calving window</title>
  <desc id="av4-d">Two calving distributions compared. A tight herd calves 60, 25, 10 and 5 percent across four 21-day cycles. A drifting herd calves 30, 28, 24 and 18 percent. Each missed cycle costs about 39 pounds of weaning weight, roughly 135 dollars a calf.</desc>

  <text x="44" y="44" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#A6FF3D">HERD REPRODUCTION</text>
  <text x="44" y="79" font-size="27" font-weight="600" fill="#F6F6F4">A tight calving window is money.</text>
  <text x="44" y="106" font-size="14.5" fill="#B6B6AE">Every 21-day cycle a cow slips, her calf weighs about 39 lb less at the sale barn.</text>

  <rect x="44" y="140" width="424" height="250" rx="14" fill="#F6F6F4" fill-opacity="0.04" stroke="#F6F6F4" stroke-opacity="0.10" stroke-width="1.5"/>
  <text x="68" y="172" font-size="16" font-weight="600" fill="#F6F6F4">Tight herd — 60·25·10·5</text>
  <text x="68" y="192" font-size="12.5" fill="#B6B6AE">Most calves on the ground in week one.</text>
  <line x1="68" y1="352" x2="444" y2="352" stroke="#F6F6F4" stroke-opacity="0.14" stroke-width="1.5"/>
  <rect x="84"  y="218" width="56" height="134" rx="4" fill="#A6FF3D"/>
  <rect x="180" y="296" width="56" height="56"  rx="4" fill="#6FD40C"/>
  <rect x="276" y="330" width="56" height="22"  rx="4" fill="#FFB020"/>
  <rect x="372" y="341" width="56" height="11"  rx="4" fill="#FF9280"/>
  <g text-anchor="middle" font-size="13" font-weight="700" fill="#F6F6F4">
    <text x="112" y="208">60%</text><text x="208" y="286">25%</text><text x="304" y="320">10%</text><text x="400" y="331">5%</text>
  </g>
  <g text-anchor="middle" font-size="12" fill="#B6B6AE">
    <text x="112" y="372">Cycle 1</text><text x="208" y="372">Cycle 2</text><text x="304" y="372">Cycle 3</text><text x="400" y="372">Cycle 4</text>
  </g>

  <rect x="492" y="140" width="424" height="250" rx="14" fill="#F6F6F4" fill-opacity="0.04" stroke="#F6F6F4" stroke-opacity="0.10" stroke-width="1.5"/>
  <text x="516" y="172" font-size="16" font-weight="600" fill="#F6F6F4">Drifting herd — 30·28·24·18</text>
  <text x="516" y="192" font-size="12.5" fill="#B6B6AE">Calves strung out across six weeks.</text>
  <line x1="516" y1="352" x2="892" y2="352" stroke="#F6F6F4" stroke-opacity="0.14" stroke-width="1.5"/>
  <rect x="532" y="285" width="56" height="67" rx="4" fill="#A6FF3D"/>
  <rect x="628" y="289" width="56" height="63" rx="4" fill="#6FD40C"/>
  <rect x="724" y="298" width="56" height="54" rx="4" fill="#FFB020"/>
  <rect x="820" y="312" width="56" height="40" rx="4" fill="#FF9280"/>
  <g text-anchor="middle" font-size="13" font-weight="700" fill="#F6F6F4">
    <text x="560" y="275">30%</text><text x="656" y="279">28%</text><text x="752" y="288">24%</text><text x="848" y="302">18%</text>
  </g>
  <g text-anchor="middle" font-size="12" fill="#B6B6AE">
    <text x="560" y="372">Cycle 1</text><text x="656" y="372">Cycle 2</text><text x="752" y="372">Cycle 3</text><text x="848" y="372">Cycle 4</text>
  </g>

  <rect x="44" y="414" width="872" height="64" rx="14" fill="#F6F6F4" fill-opacity="0.04" stroke="#F6F6F4" stroke-opacity="0.10" stroke-width="1.5"/>
  <text x="68" y="442" font-size="11.5" font-weight="700" letter-spacing="1.3" fill="#FF9280">THE COST OF DRIFT</text>
  <text x="68" y="464" font-size="15" fill="#F6F6F4">Each missed cycle costs about 39 lb of weaning weight — roughly $135 a calf.</text>
  <text x="892" y="464" font-size="12" fill="#8C8C85" text-anchor="end">Funston et al., 2012</text>
</svg>
